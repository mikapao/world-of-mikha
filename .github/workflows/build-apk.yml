# Builds the Android app (APK) in the cloud every time you push code to GitHub.
# The finished APK is attached to a new "Release" — open
#   https://github.com/<you>/<repo>/releases/latest
# on the tablet and tap the .apk to install.
# (Editing only question files in public/content/ does NOT rebuild the app —
#  those reach the tablet through GitHub Pages instead.)
name: Build Android app

on:
  push:
    branches: [main]
    paths-ignore:
      - "public/content/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VITE_CONTENT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/content/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm install

      - name: Build the game
        run: npm run build

      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Android settings (text-to-speech, mic for later, keep same signature)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          # let the app find the tablet's text-to-speech voice (Android 11+)
          sed -i 's#</manifest>#  <queries><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent></queries>\n</manifest>#' $M
          # microphone permission for the Singing Stone
          grep -q RECORD_AUDIO $M || sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />#' $M
          # always sign with the same key, so new versions install over old ones
          mkdir -p ~/.android && cp signing/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../world-of-mikha-${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: World of Mikha — build ${{ github.run_number }}
          body: "Open this page on the tablet and tap the .apk file below to install or update."
          files: world-of-mikha-${{ github.run_number }}.apk
          make_latest: true
