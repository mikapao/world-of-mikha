# Publishes the game + question files to GitHub Pages on every push.
# - Tablets check  https://<you>.github.io/<repo>/content/  for newer questions.
# - You can also play the browser version at  https://<you>.github.io/<repo>/
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Publish web + questions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      VITE_CONTENT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/content/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Remember downloads and recorded voice between builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
            public/voice
          key: voice-v1-${{ hashFiles('src/voiceLines.js', 'src/voiceKey.js', 'src/avatars/index.js', 'public/content/**', 'scripts/**') }}
          restore-keys: voice-v1-

      - name: Record the game voice (Kokoro, British "Emma")
        continue-on-error: true          # if this ever fails, the app still works with the tablet's voice
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro>=0.9" soundfile numpy
          node scripts/voice-lines.mjs voice-lines.json
          python scripts/make_voice.py voice-lines.json public/voice

      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
